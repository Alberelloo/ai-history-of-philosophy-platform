# Виды лицензий источников. Синхронизация каталога заносит их в учёт источников.
# Разрешения: display — показывать текст читателю, external_processing — отправлять текст
# внешним сервисам (эмбеддинги, LLM), quoting — цитировать фрагменты в ответах.
- code: public-domain
  title: Общественное достояние
  url: null
  permissions: {display: true, external_processing: true, quoting: true}
- code: cc-by-4.0
  title: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
  permissions: {display: true, external_processing: true, quoting: true}
- code: cc-by-sa-3.0
  title: CC BY-SA 3.0
  url: https://creativecommons.org/licenses/by-sa/3.0/
  permissions: {display: true, external_processing: true, quoting: true}
- code: cc-by-sa-4.0
  title: CC BY-SA 4.0
  url: https://creativecommons.org/licenses/by-sa/4.0/
  permissions: {display: true, external_processing: true, quoting: true}
- code: cc-by-nc-sa-4.0
  title: CC BY-NC-SA 4.0
  url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  permissions: {display: true, external_processing: true, quoting: true}
- code: cc-by-nc-4.0
  title: CC BY-NC 4.0
  url: https://creativecommons.org/licenses/by-nc/4.0/
  permissions: {display: true, external_processing: true, quoting: true}
- code: gfdl-1.3
  title: GNU FDL 1.3
  url: https://www.gnu.org/licenses/fdl-1.3.html
  permissions: {display: true, external_processing: true, quoting: true}
- code: pd-site
  title: Общественное достояние по отметке сайта
  url: null
  # Сайт публикует текст как общественное достояние (например, «Public domain in the USA» у
  # Project Gutenberg или PD-шаблон Wikisource), а годы смерти не подтверждают срок по
  # правилу 70 лет. Только для пробной загрузки: перед публичным запуском пересмотреть.
  permissions: {display: true, external_processing: true, quoting: true}
- code: public-domain-ru
  title: Общественное достояние по праву РФ
  url: null
  # Срок 70 лет после смерти автора и переводчика истёк по ст. 1281 ГК РФ, но издание вышло
  # после 1930 г. (или год неизвестен), и в США текст может быть ещё защищён. Показывать
  # только читателям из РФ. Территориальное ограничение сервис пока не применяет: метка
  # нужна, чтобы такие источники нельзя было открыть за пределами РФ при запуске.
  permissions: {display: true, external_processing: true, quoting: true}
