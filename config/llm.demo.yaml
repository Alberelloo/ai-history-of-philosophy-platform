# Демо-стенд и сквозные тесты без ключей провайдеров: модели отвечают постоянным текстом.
# Маршрутизатор относит вопрос к «базе знаний» (просьбы показать на карте — к «карте»),
# ответ ссылается на первый найденный абзац.
providers:
  demo-router:
    kind: fake
    fake_reply: '{"type": "knowledge", "confidence": 0.9, "names": []}'
    # Вопросы о карте (assistant-map-view): правила проверяются раньше постоянного ответа.
    fake_rules:
      - template: assistant.route
        contains: эмпирист
        block: question
        reply: '{"type": "map", "confidence": 0.9, "names": ["эмпиризм"]}'
      - template: assistant.route
        contains: на карте
        block: question
        reply: '{"type": "map", "confidence": 0.9, "names": []}'
      - template: assistant.map.view
        contains: эмпирист
        block: question
        reply: '{"sel": null, "groups": ["c1"], "from": 1700, "to": 1800, "roles": [], "kinds": [], "ekinds": [], "verified": false, "lens": [], "caption": "Эмпиристы XVIII века"}'
  demo-answer:
    kind: fake
    fake_reply: "Это демонстрационный ответ: он опирается на первый найденный абзац [1]. Настоящая модель подключается в config/llm.yaml."
    # Достройка графа: две допустимые связи и одна с типом вне рецепта (будет отброшена).
    fake_replies:
      # Описание карточки похоже на настоящее: служебный текст заглушки читателю не показывается.
      card.description: "Философ, чьи идеи обсуждаются в главах учебника. Описание написано моделью и помечено как сгенерированное."
      graph.extend: '{"statements": [{"subject": "Кант", "relation": "develops", "object": "Лейбниц"}, {"subject": "Юм", "relation": "influenced_by", "object": "Локк"}, {"subject": "Кант", "relation": "lived_in", "object": "Юм"}]}'
  demo-embeddings:
    kind: fake
  # Локальный прокси эмбеддингов LiteLLM (self-hosted, jina-v3) — опционально, без ключей.
  # Чтобы включить: поднять LiteLLM (docker compose -f compose.litellm.yaml up litellm),
  # переключить роль embeddings на litellm/jina-v3/dimensions:1024 и задать у search
  # PHILOGRAPH_EMBEDDING_MODEL=jina-v3, PHILOGRAPH_EMBEDDING_DIMENSION=1024.
  litellm:
    kind: openai_compatible
    base_url: ${LITELLM_BASE_URL:-http://localhost:4000}
    api_key_env: LITELLM_API_KEY

roles:
  fast: {provider: demo-router, model: demo-flash, max_output_tokens: 200}
  main: {provider: demo-answer, model: demo-flash, max_output_tokens: 800}
  strong: {provider: demo-answer, model: demo-flash, max_output_tokens: 800}
  embeddings: {provider: demo-embeddings, model: demo-embeddings}

prices:
  demo-flash: {input_cache_miss: 0.0, input_cache_hit: 0.0, output: 0.0}
  demo-embeddings: {input_cache_miss: 0.0, input_cache_hit: 0.0}
  jina-v3: {input_cache_miss: 0.0, input_cache_hit: 0.0}

budgets:
  site: {daily_limit_usd: 1.7}
  filling: {}
