# Демо-стенд и сквозные тесты без ключей провайдеров: модели отвечают постоянным текстом.
# Маршрутизатор всегда относит вопрос к «базе знаний», ответ ссылается на первый найденный абзац.
providers:
  demo-router:
    kind: fake
    fake_reply: '{"type": "knowledge", "confidence": 0.9, "names": []}'
  demo-answer:
    kind: fake
    fake_reply: "Это демонстрационный ответ: он опирается на первый найденный абзац [1]. Настоящая модель подключается в config/llm.yaml."
  demo-embeddings:
    kind: fake

roles:
  fast: {provider: demo-router, model: demo-flash, max_output_tokens: 200}
  main: {provider: demo-answer, model: demo-flash, max_output_tokens: 800}
  strong: {provider: demo-answer, model: demo-flash, max_output_tokens: 800}
  embeddings: {provider: demo-embeddings, model: demo-embeddings}

prices:
  demo-flash: {input_cache_miss: 0.0, input_cache_hit: 0.0, output: 0.0}
  demo-embeddings: {input_cache_miss: 0.0, input_cache_hit: 0.0}

budgets:
  site: {daily_limit_usd: 1.7}
  filling: {}
