<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div class="pg-demo">
  <div class="pg-seg" role="group" aria-label="Язык интерфейса">
    <button class="pg-seg__item" aria-pressed="true">RU</button><button class="pg-seg__item" aria-pressed="false">EN</button>
  </div>
  <div class="pg-seg" role="group" aria-label="Тема">
    <button class="pg-seg__item" aria-pressed="false"><svg class="pg-ico pg-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Светлая</button><button class="pg-seg__item" aria-pressed="false"><svg class="pg-ico pg-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10Z"/></svg>Тёмная</button><button class="pg-seg__item" aria-pressed="true">Как в системе</button>
  </div>
  <div class="pg-seg" role="group" aria-label="Упоминания">
    <button class="pg-seg__item" aria-pressed="true">Подчёркивать</button><button class="pg-seg__item" aria-pressed="false">При наведении</button>
  </div>
</div>
<script>
document.querySelectorAll('.pg-seg').forEach(function (group) {
  group.addEventListener('click', function (e) {
    var b = e.target.closest('.pg-seg__item'); if (!b) return;
    group.querySelectorAll('.pg-seg__item').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });
});
</script>
</body>
</html>
