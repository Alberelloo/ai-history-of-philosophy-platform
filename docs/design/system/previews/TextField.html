<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="pg-demo pg-demo--split">
  <div class="pg-field">
    <span class="pg-field__label">Поиск по библиотеке</span>
    <div class="pg-field__control"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg><input class="pg-input" placeholder="Название, автор или понятие"><span class="pg-field__kbd">Ctrl K</span></div>
  </div>
  <div class="pg-field pg-field--error">
    <span class="pg-field__label">Пароль оператора</span>
    <div class="pg-field__control"><input class="pg-input" type="password" value="неверный"></div>
    <span class="pg-field__hint">Пароль не подошёл. Проверьте раскладку и попробуйте ещё раз.</span>
  </div>
  <div class="pg-field" style="grid-column:1/-1">
    <span class="pg-field__label">Вопрос ассистенту</span>
    <textarea class="pg-input" placeholder="Спросите о выделенном месте или о чём угодно в философии"></textarea>
  </div>
</div>
</body>
</html>
