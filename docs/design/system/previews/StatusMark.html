<!-- @dsCard group="Знание" height=220 -->
<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>StatusMark</title></head>
<body>
<div class="pg-demo pg-demo--col" style="gap:18px">
  <div class="pg-demo" style="padding:0;gap:18px">
    <span class="pg-status pg-status--verified"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Проверено</span>
    <span class="pg-status"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6c2.8-1.2 5.6-1 8.5 1 2.9-2 5.7-2.2 8.5-1v12c-2.8-1.2-5.6-1-8.5 1-2.9-2-5.7-2.2-8.5-1Z"/><path d="M12 7v12"/></svg>По источникам</span>
    <span class="pg-status pg-status--generated"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 19.5 12 12 19.5 4.5 12Z"/></svg>Сгенерировано</span>
    <span class="pg-status"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M7.5 19h9M5 8.5h14"/><path d="m7 8.5-2.5 5h5Z"/><path d="m17 8.5-2.5 5h5Z"/></svg>Спорно</span>
    <span class="pg-status pg-status--contradiction"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 20.5 19h-17Z"/><path d="M12 10v4"/><path d="M12 16.6v.4"/></svg>Противоречит источникам</span>
  </div>
  <p style="margin:0;max-width:560px;font:400 15px/24px var(--font-ui);color:var(--ink-2)">
    Кант испытал влияние Юма. <span class="pg-status pg-status--verified pg-status--icon-only" title="Проверено"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
    <span class="pg-generated"><svg class="pg-generated__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Сгенерировано"><path d="M12 4.5 19.5 12 12 19.5 4.5 12Z"/></svg>Кант развивал идеи Лейбница о врождённых понятиях.</span>
  </p>
</div>
</body>
</html>
