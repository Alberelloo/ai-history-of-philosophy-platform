<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф Ф0.2 — линзы v2 (пробный кадр: выбран Кант)</title>
<link rel="stylesheet" href="../graph-f02/assets/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="atlas-app" id="app" data-theme="light">
  <main class="desk">
    <article class="folio">
      <div class="fold" aria-hidden="true"></div>
      <div class="neatline" aria-hidden="true"></div>
      <header class="head">
        <div class="eyebrow">АТЛАС ИДЕЙ · КОНЦЕПТ ЛИНЗ v2</div>
        <h1>Иммануил Кант</h1>
        <p class="subtitle">Выбран философ — его влияния и труды подсвечены по-разному</p>
        <div class="lenses" role="group" aria-label="Линзы">
          <span class="lenses-label">Линзы:</span>
          <button class="lens on"><span class="eye" aria-hidden="true"></span><span class="dot" style="--c:var(--people)"></span>Люди</button>
          <button class="lens on"><span class="eye" aria-hidden="true"></span><span class="dot" style="--c:var(--context)"></span>Контекст</button>
          <button class="lens on"><span class="eye" aria-hidden="true"></span><span class="dot" style="--c:var(--texts)"></span>Труды</button>
          <button class="lens off"><span class="eye" aria-hidden="true"></span><span class="dot" style="--c:var(--history)"></span>События мира</button>
        </div>
      </header>
      <div class="chart"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <footer class="edition"><span>Демонстрационные данные · Ф0.2 · пробный кадр «линзы v2»</span><span>«События мира» свёрнута · Спиноza — демо-персона без связей</span></footer>
    </article>
  </main>
</div>
<script src="trial.js"></script>
</body>
</html>
