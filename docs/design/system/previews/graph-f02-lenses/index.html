<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф Ф0.2 — линзы (hero-концепт)</title>
<link rel="stylesheet" href="../graph-f02/assets/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="atlas-app" id="app" data-theme="light">
  <main class="desk">
    <article class="folio">
      <div class="fold" aria-hidden="true"></div>
      <div class="neatline" aria-hidden="true"></div>
      <header class="head">
        <div class="eyebrow">АТЛАС ИДЕЙ · КОНЦЕПТ ЛИНЗ</div>
        <h1>Иммануил Кант</h1>
        <p class="subtitle">Происхождение мысли и её связи · синхронологическая карта</p>
        <div class="lenses" role="group" aria-label="Линзы">
          <span class="lenses-label">Линзы:</span>
          <span class="lens on"><span class="dot" style="--c:var(--people)"></span>Люди</span>
          <span class="lens on"><span class="dot" style="--c:var(--context)"></span>Контекст</span>
          <span class="lens on"><span class="dot" style="--c:var(--texts)"></span>Труды</span>
          <span class="lens on"><span class="dot" style="--c:var(--history)"></span>События мира</span>
        </div>
      </header>
      <div class="chart"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <footer class="edition"><span>Демонстрационные данные · Ф0.2 · hero-концепт раскладки «линзы»</span><span>эпохи и события мира — демо для показа страт</span></footer>
    </article>
  </main>
</div>
<script src="concept.js"></script>
</body>
</html>
