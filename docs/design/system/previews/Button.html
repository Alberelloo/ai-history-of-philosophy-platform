<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="pg-demo pg-demo--col">
  <div class="pg-demo" style="padding:0">
    <button class="pg-btn pg-btn--primary"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-8l-4.5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5Z"/><path d="M8 9.5h8M8 12.5h5"/></svg>Спросить ассистента</button>
    <button class="pg-btn pg-btn--secondary"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h5.5V10M10 19.5H4.5V14M19.5 4.5 13 11M4.5 19.5 11 13"/></svg>Открыть карточку</button>
    <button class="pg-btn pg-btn--ghost"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="17.5" cy="7.5" r="2.5"/><circle cx="17.5" cy="17" r="2"/><path d="m8.4 14.8 7.2-5.6M9 16.7h6.5"/></svg>Граф</button>
    <button class="pg-btn pg-btn--secondary" disabled>Недоступно</button>
  </div>
  <div class="pg-demo" style="padding:0">
    <button class="pg-btn pg-btn--primary pg-btn--sm">Спросить</button>
    <button class="pg-btn pg-btn--secondary pg-btn--sm">Где читать</button>
    <button class="pg-btn pg-btn--ghost pg-btn--sm">Отмена</button>
    <button class="pg-btn pg-btn--ghost pg-btn--icon" aria-label="Открыть панель"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg></button>
    <button class="pg-btn pg-btn--ghost pg-btn--icon pg-btn--sm" aria-label="Закрыть"><svg class="pg-ico pg-ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/></svg></button>
  </div>
</div>
</body>
</html>
