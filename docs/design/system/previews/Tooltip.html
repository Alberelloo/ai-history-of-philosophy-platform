<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Tooltip</title></head>
<body>
<div class="pg-demo" style="gap:24px">
  <div style="display:grid;justify-items:center;gap:8px">
    <span class="pg-tooltip">Открыть боковую панель</span>
    <button class="pg-btn pg-btn--ghost pg-btn--icon" aria-label="Открыть боковую панель"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14.5 4.5v15"/></svg></button>
  </div>
  <div style="display:grid;justify-items:center;gap:8px">
    <span class="pg-tooltip">Написано моделью, источники не подтверждают</span>
    <span class="pg-status pg-status--generated"><svg class="pg-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 19.5 12 12 19.5 4.5 12Z"/></svg>Сгенерировано</span>
  </div>
</div>
</body>
</html>
