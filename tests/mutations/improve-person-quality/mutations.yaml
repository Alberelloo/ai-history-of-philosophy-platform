    requirement: Качество персон
    patch: person-not-a-name.patch
    note: not_a_name не применяется к person
    expect_fail:
      - tests/knowledge/test_person_quality.py::test_garbage_person
      - tests/knowledge/test_person_quality.py::test_glued
      - tests/knowledge/test_person_quality.py::test_person_quality_invariant
      - tests/knowledge/test_person_quality.py::test_person_rule_any_input
