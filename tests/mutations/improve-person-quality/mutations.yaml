# Мутации improve-person-quality (tasks.md 3.4): на каждое требование дельт — одна и больше.
# expect_fail — тесты, каждый из которых должен упасть под мутацией: сценарный и property.
# Патчи сняты от HEAD ветки (рабочее дерево параллельно меняет разработчик).
mutations:
