    expect_fail:
      - tests/knowledge/test_person_quality.py::test_person_definition_in_prompt
  - id: component-qids-unchecked
    requirement: Слияние вариантов персоны
    patch: component-qids-unchecked.patch
    note: компонента сливается без проверки числа QID и apart:qid
    expect_fail:
