schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: PhiloGraph, an interactive AI textbook on the history of philosophy
  (pilot section: theory of knowledge). The user reads a chapter of a chosen
  textbook, opens cards of concepts/philosophers/events, builds a graph of
  connections on request, and asks an LLM assistant about a selected passage.
  Knowledge lives in an ontology (entities and relations) used together with
  RAG over source texts; every answer cites source passages. Relations that the
  LLM generated and nobody verified must be marked as such in the interface.
  Product background: docs/product/vision.md and docs/product/system-design.md.
  Specs describe observable behavior, not technology. The stack is chosen
  (docs/architecture/adr/0001-stack.md) but stays out of specs.
  Work process (roles coder/tester/reviewer/judge, tests, decision criteria):
  docs/process/working-principles.md.

rules:
  proposal:
    - State what is out of scope.
    - If the change touches money, external services, source licenses or behavior beyond the request, list the questions for the owner.
  specs:
    - Every requirement has at least one WHEN/THEN scenario.
    - Every THEN is observable in output (API response, stream, UI) and, unless purely visual, in the event log; name the event and its key fields.
    - State invariants explicitly with SHALL NOT / only / at most / always, so they can become normative tests.
  design:
    - Include a section "## Выбор решения" with at least two options (including the simplest) rated on optimality, architectural correctness, and maintainability/scalability; state the choice, its cost, and which workarounds are avoided.
    - Name new or changed log events and their fields.
  tasks:
    - Include tester tasks: scenario tests and normative (invariant) tests per requirement, each checking output and the event log, plus mutation checks of key rules, recorded in verification.md.
    - Include a final judge task: independent verdict in verification.md before the PR leaves draft.
