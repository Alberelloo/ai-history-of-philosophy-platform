# Возможности, для которых CI требует тест на каждое требование.
# Возможность добавляется сюда, когда её изменение реализовано.
enforce:
  - llm-gateway
  - observability
  - operator-access
  - service-runtime
  - source-registry
  - source-processing
  - text-quality-check
  - document-structure
  - source-library
  - chapter-reading
  - paragraph-indexing
  - paragraph-search
  - assistant-dialog
  - question-routing
  - answer-grounding
  - evaluation-datasets
  - quality-evaluation
  - ontology-registry
  - ontology-entities
  - ontology-statements
  - ontology-extraction
  - ontology-review
  - entity-mentions
  - entity-cards
  - knowledge-graph
  - source-scope
  - ontology-retrieval
  - first-run-notice
  - reader-settings
  - abuse-protection
  - backup-and-recovery
  - operational-alerts
  - deployment
  - visual-design
  - source-catalog
  - regional-access
  - entity-portraits

# Возможности, где CI требует тест на каждый сценарий (маркер req(..., scenario="<заголовок>")).
# Пока пусто — режим отчёта: `python scripts/check_traceability.py --report` перечисляет
# непокрытые сценарии. Возможность добавляется, когда тестировщик расставил маркеры.
enforce_scenarios: []

# Возможности, где у каждого требования должен быть тест с проверкой журнала (events, wait_logs,
# caplog) или маркер с nolog="<причина>". Пока пусто — режим отчёта.
enforce_log: []
