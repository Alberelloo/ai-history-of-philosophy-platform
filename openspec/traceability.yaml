# Возможности, для которых CI требует тест на каждое требование.
# Возможность добавляется сюда, когда её изменение реализовано.
enforce:
  - llm-gateway
  - observability
  - operator-access
  - service-runtime
  - source-registry
  - source-processing
  - text-quality-check
  - document-structure
  - source-library
  - chapter-reading
  - paragraph-indexing
  - paragraph-search
  - assistant-dialog
  - question-routing
  - answer-grounding
