<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PhiloGraph</title>
    <script>
      // Тема и язык до первой отрисовки, чтобы страница не мигала. Формат — web/src/storage.ts.
      (function () {
        var root = document.documentElement;
        var state = {};
        try {
          var ls = window.localStorage;
          state = JSON.parse(ls.getItem("philograph:v4") || ls.getItem("philograph:v3") || ls.getItem("philograph:v2") || "{}") || {};
        } catch (e) {
          state = {};
        }
        if (state.theme === "light" || state.theme === "dark") root.setAttribute("data-theme", state.theme);
        var lang = state.lang === "ru" || state.lang === "en" ? state.lang : null;
        if (!lang) lang = /^ru/i.test(navigator.language || "") ? "ru" : "en";
        root.lang = lang;
        // Закреплённая боковая панель: отступ содержимого до первой отрисовки, без сдвига.
        if (state.sidebarPinned === true) root.setAttribute("data-sidebar", "pinned");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
