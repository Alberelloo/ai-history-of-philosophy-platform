name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Репозиторий публичный, а проект ходит в LLM API: ключ в истории коммитов = утечка.
      - name: Поиск секретов
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --redact --no-banner

      - name: Битые ссылки в Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

      # Python-шаги включаются, когда в корне появится pyproject.toml.
      - name: Есть ли Python-проект
        id: py
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pyproject.toml нет, линтер и тесты пропущены"
          fi

      - uses: actions/setup-python@v5
        if: steps.py.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        if: steps.py.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Ruff
        if: steps.py.outputs.present == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Границы сервисов
        if: steps.py.outputs.present == 'true'
        run: lint-imports

      - name: Прослеживаемость требований
        if: steps.py.outputs.present == 'true'
        run: python scripts/check_traceability.py

      - name: Pytest (SQLite)
        if: steps.py.outputs.present == 'true'
        run: pytest -q

      - name: Pytest (PostgreSQL)
        if: steps.py.outputs.present == 'true'
        env:
          PHILOGRAPH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
        run: pytest -q
