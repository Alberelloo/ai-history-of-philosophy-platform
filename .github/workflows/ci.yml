name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Репозиторий публичный, а проект ходит в LLM API: ключ в истории коммитов = утечка.
      - name: Поиск секретов
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --redact --no-banner

      - name: Битые ссылки в Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

      # Python-шаги включаются, когда в корне появится pyproject.toml.
      - name: Есть ли Python-проект
        id: py
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pyproject.toml нет, линтер и тесты пропущены"
          fi

      - uses: actions/setup-python@v5
        if: steps.py.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        if: steps.py.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: Ruff
        if: steps.py.outputs.present == 'true'
        run: |
          ruff check .
          ruff format --check .

      - uses: actions/setup-node@v4
        if: steps.py.outputs.present == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка веб-клиента
        if: steps.py.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Браузер для тестов интерфейса
        if: steps.py.outputs.present == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Границы сервисов
        if: steps.py.outputs.present == 'true'
        run: lint-imports

      - name: Прослеживаемость требований
        if: steps.py.outputs.present == 'true'
        run: python scripts/check_traceability.py

      - name: Каталог источников
        if: steps.py.outputs.present == 'true'
        run: python -m philograph.library.catalog validate

      - name: Pytest (SQLite)
        if: steps.py.outputs.present == 'true'
        run: pytest -q

      - name: Pytest (PostgreSQL)
        if: steps.py.outputs.present == 'true'
        env:
          PHILOGRAPH_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
        # Сквозные тесты идут на своём стенде, второй прогон им не нужен.
        run: pytest -q -m "not e2e"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Настройки стенда
        run: |
          {
            echo "POSTGRES_PASSWORD=e2e-ci-password"
            echo "DEEPSEEK_API_KEY=not-used-in-demo"
            echo "PHILOGRAPH_VISITOR_SECRET=e2e-ci-secret"
            # Пароль оператора демо-стенда: demo-operator. Кавычки — чтобы Compose
            # не подставлял переменные вместо $.
            echo "PHILOGRAPH_OPERATOR_PASSWORD_HASH='pbkdf2_sha256\$1000\$64656d6f2d73616c74\$907c04102bee49f460c2bee8e69686fd19c37d7fbc0fe866c4a0fb4a84fb029d'"
          } > .env

      # Вся система в контейнерах: PostgreSQL, Qdrant, сервисы, исполнитель, шлюз, демо-данные.
      - name: Подъём системы в Docker
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Зависимости тестов и браузер
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Сквозные тесты в браузере
        env:
          PHILOGRAPH_E2E_URL: http://127.0.0.1:8080
        run: pytest -q tests/e2e

      # Публичный сервер: Caddy с HTTPS (для localhost сертификат выпускает его внутренний
      # центр), закрытый порт шлюза, перезапуск упавшего сервиса.
      # Значения региона — как у стенда: Caddy считает локальный адрес CDN, страна — CF-IPCountry.
      - name: Развёртывание с HTTPS
        env:
          PHILOGRAPH_DOMAIN: localhost
          PHILOGRAPH_REGION_HEADER: CF-IPCountry
          PHILOGRAPH_CDN_IPS: 127.0.0.1/32
        run: docker compose -f compose.yaml -f compose.e2e.yaml -f compose.prod.yaml up -d --wait

      - name: Проверки развёртывания
        env:
          PHILOGRAPH_DOMAIN: localhost
          PHILOGRAPH_REGION_HEADER: CF-IPCountry
          PHILOGRAPH_CDN_IPS: 127.0.0.1/32
          PHILOGRAPH_DEPLOY_URL: https://localhost
          PHILOGRAPH_DEPLOY_COMPOSE: -f compose.yaml -f compose.e2e.yaml -f compose.prod.yaml
        run: pytest -q tests/ops/test_deploy.py

      - name: Журналы сервисов при падении
        if: failure()
        env:
          PHILOGRAPH_DOMAIN: localhost
          PHILOGRAPH_REGION_HEADER: CF-IPCountry
          PHILOGRAPH_CDN_IPS: 127.0.0.1/32
        run: docker compose -f compose.yaml -f compose.e2e.yaml -f compose.prod.yaml logs --no-color | tail -300
