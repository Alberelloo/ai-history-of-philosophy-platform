name: Auto-merge

# Включает автослияние для каждого готового PR. GitHub сольёт его сам (squash),
# как только пройдут обязательные проверки из защиты ветки main.
# Чтобы PR не слился сам, открывайте его как draft.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Включить автослияние
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
