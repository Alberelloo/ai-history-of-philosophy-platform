name: Эталоны снимков

# Ручной запуск: эталоны снимков экрана для Linux снимаются в том же образе, где их сравнивает
# CI, и выкладываются артефактом. Эталоны не коммитятся сами: их скачивают, просматривают и
# кладут в tests/e2e/visual/baselines/linux/ обычным PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    name: baselines
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Сборка веб-клиента
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Браузер
        run: python -m playwright install --with-deps chromium

      # Тесты сами поднимают стенд (scripts/dev_stack.py), как в задании checks.
      - name: Снимки
        run: python scripts/visual_check.py --update --no-build

      - name: Эталоны Linux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baselines-linux
          path: tests/e2e/visual/baselines/linux/
