# Вся система одной командой: docker compose up --build
# Секреты берутся из файла .env рядом (в репозиторий не попадает), пример в .env.example.
# Новые сервисы добавляются сюда вместе со своими изменениями OpenSpec.

x-service: &service
  build: .
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: philograph
      POSTGRES_USER: philograph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philograph"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 10

  llm:
    <<: *service
    command: uvicorn philograph.llm.main:app --host 0.0.0.0 --port 8000
    environment:
      PHILOGRAPH_LLM_CONFIG: /app/config/llm.yaml
      PHILOGRAPH_DATABASE_URL: postgresql+psycopg://philograph:${POSTGRES_PASSWORD}@postgres/philograph
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status == 200 else 1)"]
      interval: 10s
      retries: 6

  library:
    <<: *service
    command: uvicorn philograph.library.main:app --host 0.0.0.0 --port 8001
    environment:
      PHILOGRAPH_DATABASE_URL: postgresql+psycopg://philograph:${POSTGRES_PASSWORD}@postgres/philograph
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/ready').status == 200 else 1)"]
      interval: 10s
      retries: 6

  search:
    <<: *service
    command: uvicorn philograph.search.main:app --host 0.0.0.0 --port 8002
    environment: &search-env
      PHILOGRAPH_DATABASE_URL: postgresql+psycopg://philograph:${POSTGRES_PASSWORD}@postgres/philograph
      PHILOGRAPH_LIBRARY_URL: http://library:8001
      PHILOGRAPH_LLM_URL: http://llm:8000
      PHILOGRAPH_QDRANT_URL: http://qdrant:6333
      # Провайдер эмбеддингов выбирается замером (docs/architecture/adr/0002-embeddings.md).
      PHILOGRAPH_EMBEDDING_MODEL: stub-embeddings
      PHILOGRAPH_EMBEDDING_DIMENSION: "8"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health/ready').status == 200 else 1)"]
      interval: 10s
      retries: 6

  assistant:
    <<: *service
    command: uvicorn philograph.assistant.main:app --host 0.0.0.0 --port 8003
    environment:
      PHILOGRAPH_SEARCH_URL: http://search:8002
      PHILOGRAPH_LLM_URL: http://llm:8000
      PHILOGRAPH_VISITOR_SECRET: ${PHILOGRAPH_VISITOR_SECRET:?задайте PHILOGRAPH_VISITOR_SECRET в .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/health/ready').status == 200 else 1)"]
      interval: 10s
      retries: 6

  worker:
    <<: *service
    # Исполнитель очереди: обработка источников, плановая проверка, события для конвейеров.
    command: python -m philograph.worker
    environment:
      <<: *search-env
      PHILOGRAPH_FILES_ROOT: /data/files
    volumes:
      - library-files:/data/files
    healthcheck:
      test: ["CMD", "python", "-c", "import philograph.worker"]
      interval: 30s

  gateway:
    <<: *service
    # Единственный сервис, видимый снаружи: клиент, /api → библиотека, /api/assistant → ассистент.
    command: uvicorn philograph.gateway.app:app --host 0.0.0.0 --port 8080
    environment:
      PHILOGRAPH_LIBRARY_URL: http://library:8001
      PHILOGRAPH_ASSISTANT_URL: http://assistant:8003
      PHILOGRAPH_WEB_ROOT: /app/web/dist
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready').status == 200 else 1)"]
      interval: 10s
      retries: 6

volumes:
  library-files:
  postgres-data:
  qdrant-data:
